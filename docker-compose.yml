# A single-node OpenSearch on localhost:9200 for build_index.py and evaluate.py.
#
#   OPENSEARCH_DATA_DIR=/path/to/disk OPENSEARCH_HEAP=16g docker compose up -d --build
#
# The security plugin is disabled, so the port must not be reachable from outside the machine.
services:
  opensearch:
    build: .
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-16g} -Xmx${OPENSEARCH_HEAP:-16g}
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - ${OPENSEARCH_DATA_DIR:-./opensearch-data}:/usr/share/opensearch/data
    ports:
      - 127.0.0.1:9200:9200
